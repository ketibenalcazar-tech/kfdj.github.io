# 专业开发搭建 APP 网站 H5 平台
名称：向页面部署静态内容

on:
# 通过针对默认分支的推送运行
  push:
    branches: ["main"]

# 允许您从动作标签手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一次并发部署，跳过正在进行和最新队列之间的队列运行。
# 但请不要取消正在进行的运行，因为我们希望这些生产部署能够完成。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
# 单次部署任务，因为我们刚部署
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
- 名称：上传文物
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传整个仓库
          path: '.'
      - 名称： 部署到 GitHub Pages name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
